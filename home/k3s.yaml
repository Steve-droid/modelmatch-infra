# Single physical host. Embedded etcd gives scheduled cluster-state snapshots,
# not physical HA. Snapshots do not contain application PVC data.
node-name: driftplain-home
node-ip: 192.168.1.93
flannel-iface: eno1
cluster-init: true
cluster-cidr: 10.42.0.0/16
service-cidr: 10.43.0.0/16
disable:
  - traefik
  - servicelb
secrets-encryption: true
write-kubeconfig-mode: "0600"
etcd-snapshot-schedule-cron: "0 */12 * * *"
etcd-snapshot-retention: 3
etcd-snapshot-compress: true
kubelet-arg:
  - container-log-max-size=10Mi
  - container-log-max-files=3
