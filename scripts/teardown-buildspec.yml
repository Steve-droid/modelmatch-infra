# CodeBuild buildspec for the platform teardown (P34b budget kill switch + P47 final teardown).
# The project clones public modelmatch-infra@main and runs scripts/teardown-platform.sh. DRY_RUN comes
# from the project's environment (default 1 = fail-safe) or a start-build override (the Lambda passes
# its own DRY_RUN; the P47 command passes 0). TF_VERSION / TF_SHA256 are project env vars from tfvars.
version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - |
        set -euo pipefail
        echo "installing terraform ${TF_VERSION} (pinned sha256)"
        curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
        echo "${TF_SHA256}  /tmp/terraform.zip" | sha256sum -c -
        unzip -o -q /tmp/terraform.zip -d /usr/local/bin
        terraform version
        aws --version
        jq --version
        git log -1 --oneline
  build:
    commands:
      - scripts/teardown-platform.sh
